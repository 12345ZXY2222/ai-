<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI模拟平台 - 工作版本</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f5f5f5;
        }
        
        .app-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: linear-gradient(135deg, #1890ff 0%, #096dd9 100%);
            color: white;
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        
        .logo {
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .nav-menu {
            display: flex;
            gap: 24px;
            list-style: none;
        }
        
        .nav-menu a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        
        .nav-menu a:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .nav-menu a.active {
            background-color: rgba(255, 255, 255, 0.2);
        }
        
        .content {
            flex: 1;
            padding: 24px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 24px;
            margin-bottom: 24px;
        }
        
        .card h2 {
            color: #1890ff;
            margin-bottom: 16px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 8px;
        }
        
        .btn {
            display: inline-block;
            padding: 8px 16px;
            background: #1890ff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        
        .btn:hover {
            background: #096dd9;
        }
        
        .btn-primary {
            background: #1890ff;
        }
        
        .btn-success {
            background: #52c41a;
        }
        
        .btn-warning {
            background: #faad14;
        }
        
        .btn-danger {
            background: #ff4d4f;
        }
        
        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        
        .table th,
        .table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .table th {
            background: #fafafa;
            font-weight: 600;
        }
        
        .table tr:hover {
            background: #fafafa;
        }
        
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .tag-success {
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #52c41a;
        }
        
        .tag-warning {
            background: #fff7e6;
            border: 1px solid #ffd591;
            color: #fa8c16;
        }
        
        .tag-error {
            background: #fff2f0;
            border: 1px solid #ffccc7;
            color: #ff4d4f;
        }
        
        .tag-processing {
            background: #e6f7ff;
            border: 1px solid #91d5ff;
            color: #1890ff;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 24px;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-active {
            background: #52c41a;
        }
        
        .status-inactive {
            background: #ff4d4f;
        }
        
        .api-status {
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
        }
        
        .api-status-success {
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #52c41a;
        }
        
        .api-status-error {
            background: #fff2f0;
            border: 1px solid #ffccc7;
            color: #ff4d4f;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .error-message {
            background: #fff2f0;
            border: 1px solid #ffccc7;
            color: #ff4d4f;
            padding: 16px;
            border-radius: 4px;
            margin: 16px 0;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        // 主应用组件
        const App = () => {
            const [currentPage, setCurrentPage] = React.useState('papers');
            const [apiStatus, setApiStatus] = React.useState('checking');
            const [apiError, setApiError] = React.useState(null);
            
            // 检查API连接
            React.useEffect(() => {
                checkApiConnection();
            }, []);
            
            const checkApiConnection = async () => {
                try {
                    const response = await fetch('/api/paper-reproductions');
                    if (response.ok) {
                        setApiStatus('connected');
                    } else {
                        setApiStatus('error');
                        setApiError(`API返回状态: ${response.status}`);
                    }
                } catch (error) {
                    setApiStatus('error');
                    setApiError(error.message);
                }
            };
            
            // 导航菜单
            const Navigation = () => (
                <nav className="header">
                    <div className="logo">
                        <span>🤖 AI模拟平台</span>
                    </div>
                    <ul className="nav-menu">
                        <li>
                            <a 
                                href="#" 
                                className={currentPage === 'agents' ? 'active' : ''}
                                onClick={(e) => { e.preventDefault(); setCurrentPage('agents'); }}
                            >
                                智能体管理
                            </a>
                        </li>
                        <li>
                            <a 
                                href="#" 
                                className={currentPage === 'relationships' ? 'active' : ''}
                                onClick={(e) => { e.preventDefault(); setCurrentPage('relationships'); }}
                            >
                                关系管理
                            </a>
                        </li>
                        <li>
                            <a 
                                href="#" 
                                className={currentPage === 'simulation' ? 'active' : ''}
                                onClick={(e) => { e.preventDefault(); setCurrentPage('simulation'); }}
                            >
                                模拟设计
                            </a>
                        </li>
                        <li>
                            <a 
                                href="#" 
                                className={currentPage === 'world' ? 'active' : ''}
                                onClick={(e) => { e.preventDefault(); setCurrentPage('world'); }}
                            >
                                世界设计
                            </a>
                        </li>
                        <li>
                            <a 
                                href="#" 
                                className={currentPage === 'papers' ? 'active' : ''}
                                onClick={(e) => { e.preventDefault(); setCurrentPage('papers'); }}
                            >
                                论文复现
                            </a>
                        </li>
                    </ul>
                </nav>
            );
            
            // API状态显示
            const ApiStatus = () => {
                if (apiStatus === 'checking') {
                    return <div className="api-status">检查API连接中...</div>;
                }
                
                if (apiStatus === 'connected') {
                    return (
                        <div className="api-status api-status-success">
                            ✅ 后端API连接正常 (localhost:8001)
                        </div>
                    );
                }
                
                if (apiStatus === 'error') {
                    return (
                        <div className="api-status api-status-error">
                            ❌ API连接失败: {apiError}
                            <div style={{ marginTop: '8px', fontSize: '14px' }}>
                                <p>请检查:</p>
                                <ul style={{ marginLeft: '20px' }}>
                                    <li>后端服务是否运行 (localhost:8001)</li>
                                    <li>网络连接是否正常</li>
                                    <li>防火墙设置</li>
                                </ul>
                                <button className="btn" onClick={checkApiConnection} style={{ marginTop: '8px' }}>
                                    重试连接
                                </button>
                            </div>
                        </div>
                    );
                }
                
                return null;
            };
            
            // 论文复现页面
            const PapersPage = () => {
                const [papers, setPapers] = React.useState([
                    {
                        id: 'test-paper-1',
                        title: '深度学习在计算机视觉中的应用',
                        status: 'completed',
                        file_size: 2456789,
                        created_at: '2026-02-19T10:30:00Z',
                        description: '一篇关于深度学习和计算机视觉的综述论文',
                        reproduction_code: 'import numpy as np\nimport matplotlib.pyplot as plt\n\n# 测试代码\nx = np.linspace(0, 10, 100)\ny = np.sin(x)\nplt.plot(x, y)\nplt.title("Sine Wave")\nplt.show()',
                        execution_result: 'Plot displayed successfully.\nExecution time: 0.45 seconds'
                    },
                    {
                        id: 'test-paper-2',
                        title: '强化学习算法比较研究',
                        status: 'analyzing',
                        file_size: 1876543,
                        created_at: '2026-02-19T11:15:00Z',
                        description: '比较不同强化学习算法的性能',
                    },
                    {
                        id: 'test-paper-3',
                        title: '自然语言处理中的Transformer模型',
                        status: 'failed',
                        file_size: 3123456,
                        created_at: '2026-02-19T12:45:00Z',
                        description: 'Transformer模型在NLP任务中的应用研究',
                        error_message: '依赖包版本冲突，需要更新tensorflow到2.0+版本'
                    }
                ]);
                
                const [selectedPaper, setSelectedPaper] = React.useState(null);
                const [showModal, setShowModal] = React.useState(false);
                
                const formatFileSize = (bytes) => {
                    if (bytes < 1024) return bytes + ' B';
                    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
                    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
                };
                
                const formatDate = (dateString) => {
                    return new Date(dateString).toLocaleString('zh-CN');
                };
                
                const getStatusTag = (status) => {
                    switch (status) {
                        case 'completed':
                            return <span className="tag tag-success">已完成</span>;
                        case 'analyzing':
                            return <span className="tag tag-warning">分析中</span>;
                        case 'failed':
                            return <span className="tag tag-error">失败</span>;
                        default:
                            return <span className="tag tag-processing">处理中</span>;
                    }
                };
                
                const handleViewDetails = (paper) => {
                    setSelectedPaper(paper);
                    setShowModal(true);
                };
                
                const handleUploadPaper = () => {
                    alert('论文上传功能需要后端API支持。当前为演示模式。');
                };
                
                const handleAnalyzePaper = (paperId) => {
                    alert(`开始分析论文 ${paperId}...`);
                };
                
                const handleExecuteCode = (paperId) => {
                    alert(`执行论文 ${paperId} 的复现代码...`);
                };
                
                return (
                    <div>
                        <div className="card">
                            <h2>论文复现管理</h2>
                            <p>上传、分析和执行论文复现代码。</p>
                            
                            <div style={{ margin: '16px 0' }}>
                                <button className="btn btn-primary" onClick={handleUploadPaper}>
                                    上传论文PDF
                                </button>
                                <span style={{ marginLeft: '12px', color: '#666', fontSize: '14px' }}>
                                    支持PDF格式，最大100MB
                                </span>
                            </div>
                            
                            <div className="card">
                                <h3>论文列表</h3>
                                <table className="table">
                                    <thead>
                                        <tr>
                                            <th>标题</th>
                                            <th>状态</th>
                                            <th>文件大小</th>
                                            <th>上传时间</th>
                                            <th>操作</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {papers.map(paper => (
                                            <tr key={paper.id}>
                                                <td>
                                                    <div style={{ fontWeight: '500' }}>{paper.title}</div>
                                                    <div style={{ fontSize: '12px', color: '#666' }}>
                                                        ID: {paper.id.substring(0, 8)}...
                                                    </div>
                                                </td>
                                                <td>{getStatusTag(paper.status)}</td>
                                                <td>{formatFileSize(paper.file_size)}</td>
                                                <td>{formatDate(paper.created_at)}</td>
                                                <td>
                                                    <div style={{ display: 'flex', gap: '8px' }}>
                                                        <button 
                                                            className="btn"
                                                            onClick={() => handleViewDetails(paper)}
                                                        >
                                                            查看
                                                        </button>
                                                        {paper.status === 'completed' && (
                                                            <>
                                                                <button 
                                                                    className="btn btn-success"
                                                                    onClick={() => handleAnalyzePaper(paper.id)}
                                                                >
                                                                    分析
                                                                </button>
                                                                {paper.reproduction_code && (
                                                                    <button 
                                                                        className="btn btn-warning"
                                                                        onClick={() => handleExecuteCode(paper.id)}
                                                                    >
                                                                        执行
                                                                    </button>
                                                                )}
                                                            </>
                                                        )}
                                                        {paper.status === 'failed' && (
                                                            <button 
                                                                className="btn"
                                                                onClick={() => handleAnalyzePaper(paper.id)}
                                                            >
                                                                重试
                                                            </button>
                                                        )}
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        
                        {showModal && selectedPaper && (
                            <div className="modal">
                                <div className="modal-content">
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                                        <h3>论文详情</h3>
                                        <button className="btn" onClick={() => setShowModal(false)}>
                                            关闭
                                        </button>
                                    </div>
                                    
                                    <h4>{selectedPaper.title}</h4>
                                    
                                    <div style={{ margin: '16px 0', padding: '16px', background: '#fafafa', borderRadius: '4px' }}>
                                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                                            <div>
                                                <strong>论文ID:</strong> {selectedPaper.id}
                                            </div>
                                            <div>
                                                <strong>状态:</strong> {getStatusTag(selectedPaper.status)}
                                            </div>
                                            <div>
                                                <strong>文件大小:</strong> {formatFileSize(selectedPaper.file_size)}
                                            </div>
                                            <div>
                                                <strong>上传时间:</strong> {formatDate(selectedPaper.created_at)}
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div style={{ margin: '16px 0' }}>
                                        <strong>描述:</strong>
                                        <p>{selectedPaper.description}</p>
                                    </div>
                                    
                                    {selectedPaper.reproduction_code && (
                                        <div style={{ margin: '16px 0' }}>
                                            <strong>复现代码:</strong>
                                            <pre style={{
                                                background: '#f6f8fa',
                                                padding: '12px',
                                                borderRadius: '4px',
                                                overflow: 'auto',
                                                fontSize: '12px',
                                                marginTop: '8px'
                                            }}>
                                                {selectedPaper.reproduction_code}
                                            </pre>
                                        </div>
                                    )}
                                    
                                    {selectedPaper.execution_result && (
                                        <div style={{ margin: '16px 0' }}>
                                            <strong>执行结果:</strong>
                                            <pre style={{
                                                background: '#f6f8fa',
                                                padding: '12px',
                                                borderRadius: '4px',
                                                overflow: 'auto',
                                                fontSize: '12px',
                                                marginTop: '8px'
                                            }}>
                                                {selectedPaper.execution_result}
                                            </pre>
                                        </div>
                                    )}
                                    
                                    {selectedPaper.error_message && (
                                        <div style={{ margin: '16px 0' }}>
                                            <strong>错误信息:</strong>
                                            <div className="error-message">
                                                {selectedPaper.error_message}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                );
            };
            
            // 其他页面组件
            const AgentsPage = () => (
                <div className="card">
                    <h2>智能体管理</h2>
                    <p>创建、配置和管理AI智能体。</p>
                    <div className="card">
                        <h3>智能体列表</h3>
                        <p>智能体管理功能需要完整的React应用支持。</p>
                        <p>当前为演示模式，完整功能需要修复Vite模块系统。</p>
                    </div>
                </div>
            );
            
            const RelationshipsPage = () => (
                <div className="card">
                    <h2>关系管理</h2>
                    <p>管理智能体之间的关系和交互。</p>
                    <div className="card">
                        <h3>关系网络</h3>
                        <p>关系管理功能需要完整的React应用支持。</p>
                    </div>
                </div>
            );
            
            const SimulationPage = () => (
                <div className="card">
                    <h2>模拟设计</h2>
                    <p>设计和配置AI模拟场景。</p>
                    <div className="card">
                        <h3>模拟编辑器</h3>
                        <p>模拟设计功能需要完整的React应用支持。</p>
                    </div>
                </div>
            );
            
            const WorldPage = () => (
                <div className="card">
                    <h2>世界设计</h2>
                    <p>设计和配置模拟世界环境。</p>
                    <div className="card">
                        <h3>世界编辑器</h3>
                        <p>世界设计功能需要完整的React应用支持。</p>
                    </div>
                </div>
            );
            
            // 主渲染逻辑
            const renderContent = () => {
                switch (currentPage) {
                    case 'agents':
                        return <AgentsPage />;
                    case 'relationships':
                        return <RelationshipsPage />;
                    case 'simulation':
                        return <SimulationPage />;
                    case 'world':
                        return <WorldPage />;
                    case 'papers':
                    default:
                        return <PapersPage />;
                }
            };
            
            return (
                <div className="app-container">
                    <Navigation />
                    <main className="content">
                        <ApiStatus />
                        {renderContent()}
                    </main>
                </div>
            );
        };
        
        // 渲染应用
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
        
        console.log('AI模拟平台 - CDN版本已加载');
    </script>
</body>
</html>
